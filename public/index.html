<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Planner</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Study Planner Generator</h1>
        <p class="subtitle">Describe your goals. Get a one-week timetable instantly.</p>
      </div>
      <div id="user-section">
        <button id="auth-btn" onclick="openAuthModal()">Sign In</button>
        <div id="user-info" class="hidden">
          <span id="user-email"></span>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>
    
    <div id="auth-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close" onclick="closeAuthModal()">&times;</span>
        <div id="login-form">
          <h2>Login</h2>
          <input type="email" id="login-email" placeholder="Email">
          <input type="password" id="login-password" placeholder="Password">
          <button onclick="login()">Login</button>
          <p>Don't have an account? <a href="#" onclick="toggleAuthForms()">Sign Up</a></p>
        </div>
        <div id="signup-form" class="hidden">
          <h2>Sign Up</h2>
          <input type="email" id="signup-email" placeholder="Email">
          <input type="password" id="signup-password" placeholder="Password">
          <button onclick="signup()">Sign Up</button>
          <p>Already have an account? <a href="#" onclick="toggleAuthForms()">Login</a></p>
        </div>
      </div>
    </div>

    <div class="controls">
      <textarea id="input" placeholder="e.g., 2 hours daily for Math and Physics, evenings only, include breaks"></textarea>
      <div class="side-controls">
        <label class="file-label" for="notes-upload">
          <span class="file-icon">📁</span>
          <span>Upload Notes (PDF, Word, PPT, Text)</span>
          <input type="file" id="notes-upload" accept=".txt,.md,.pdf,.docx,.doc,.pptx,.ppt" multiple>
        </label>
        <button id="generateBtn" onclick="generate()"><span class="btn-inner"><span>Generate</span></span></button>
      </div>
    </div>
    <div id="output"></div>
    <div id="extra-content" class="extra-content"></div>
    
    <div id="action-bar" class="action-bar hidden">
      <button id="editBtn" onclick="toggleEdit()"><span class="btn-inner">✏️ Edit</span></button>
      <button id="saveBtn" onclick="toggleSave()" class="hidden"><span class="btn-inner">💾 Save</span></button>
      <button id="downloadBtn" onclick="downloadImage()"><span class="btn-inner">🖼️ Download Image</span></button>
    </div>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
